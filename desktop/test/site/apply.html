<!doctype html><html><head><meta charset="utf-8"><title>Demo Office – New application</title>
<style>body{font-family:system-ui;padding:30px;background:#f6f7fb}form{background:#fff;padding:24px;border-radius:14px;display:grid;grid-template-columns:140px 260px;gap:10px 14px;width:max-content}input,select,button{padding:8px;border-radius:8px;border:1px solid #ccd}button{background:#0f766e;color:#fff;border:0;grid-column:2}#ref{margin-top:14px;font-weight:600}</style></head>
<body><h1>New application</h1>
<form id="app">
  <label for="fullname">Full name</label><input id="fullname" name="fullname">
  <label for="caseid">Case ID</label><input id="caseid" name="caseid">
  <label for="city">City</label><select id="city" name="city"><option value="">—</option><option>Rabat</option><option>Fes</option><option>Casablanca</option></select>
  <label for="agree">Consent given</label><input id="agree" name="agree" type="checkbox">
  <label for="phone">Phone</label><input id="phone" name="phone">
  <button type="submit" id="save">Save application</button>
</form>
<div id="ref"></div>
<script>
document.getElementById('app').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  const subs = JSON.parse(localStorage.subs || '[]');
  subs.push({ name: f.fullname.value, caseid: f.caseid.value, city: f.city.value, agree: f.agree.checked, phone: f.phone.value });
  localStorage.subs = JSON.stringify(subs);
  document.getElementById('ref').textContent = 'Saved ref R-' + f.caseid.value;
  f.reset();
});
</script></body></html>
