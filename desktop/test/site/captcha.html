<!doctype html><html><head><meta charset="utf-8"><title>Demo Office – Verify</title>
<style>body{font-family:system-ui;padding:30px;background:#f6f7fb}.g-recaptcha{display:inline-flex;gap:10px;align-items:center;background:#fff;border:1px solid #ccd;border-radius:6px;padding:14px 18px;margin-bottom:20px}form{display:none;background:#fff;padding:20px;border-radius:12px;width:320px;gap:10px;flex-direction:column}form.show{display:flex}input,button{padding:8px;border-radius:8px;border:1px solid #ccd}</style></head>
<body><h1>Send a request</h1>
<div class="g-recaptcha" id="gate"><input type="checkbox" id="robot"><label for="robot">I'm not a robot</label></div>
<form id="f"><label for="name">Your name</label><input id="name"><button type="submit" id="send">Send</button></form>
<div id="done"></div>
<script>
document.getElementById('robot').addEventListener('change', (e) => {
  if (!e.target.checked) return;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('f').classList.add('show');
});
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  document.getElementById('done').textContent = 'Sent: ' + document.getElementById('name').value;
});
</script></body></html>
