<!doctype html><html><head><meta charset="utf-8"><title>Demo Store – Product</title>
<style>body{font-family:system-ui;padding:30px;background:#f6f7fb}.box{background:#fff;border-radius:12px;padding:24px;width:420px}.price{font-size:28px;font-weight:700;color:#0f766e}</style></head>
<body><div class="box">
<h1 id="name"></h1>
<div class="meta">In stock: <b id="stock"></b></div>
<div class="price" id="price"></div>
<a href="javascript:history.back()">Back</a>
</div>
<script>
const n = +new URLSearchParams(location.search).get('id') || 1;
document.getElementById('name').textContent = ['Desk Lamp', 'Office Chair', 'Bookshelf', 'Monitor Arm'][n - 1];
document.getElementById('price').textContent = '$' + (n * 12.5).toFixed(2);
document.getElementById('stock').textContent = n % 2 ? 'yes' : 'no';
</script></body></html>
