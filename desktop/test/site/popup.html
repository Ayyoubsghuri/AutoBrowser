<!doctype html><html><head><meta charset="utf-8"><title>Demo Shop – Checkout</title>
<style>body{font-family:system-ui;padding:30px;background:#f6f7fb}button{padding:10px 16px;border-radius:8px;border:0;background:#4f46e5;color:#fff}#status{margin-top:16px;font-weight:600}</style></head>
<body><h1>Checkout order 7</h1>
<button id="pay" onclick="window.open('confirm.html?order=7', 'pay', 'width=520,height=420')">Pay</button>
<div id="status">Not paid</div>
<script>
window.addEventListener('message', (e) => { if (String(e.data).startsWith('paid:')) document.getElementById('status').textContent = 'Paid ' + String(e.data).slice(5); });
</script></body></html>
