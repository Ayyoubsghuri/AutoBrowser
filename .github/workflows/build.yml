name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest -q
      - run: cd frontend && npm ci && npm run lint && npm run build
      - run: cd desktop && npm ci && npm run check
      - name: End-to-end (record + replay in the real app)
        run: cd desktop && xvfb-run -a -s "-screen 0 1440x920x24" npm run test:e2e

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBrowser-windows
          path: |
            desktop/release/*.exe
